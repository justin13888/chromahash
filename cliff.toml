# git-cliff configuration for chromahash.
#
# This config manages ONLY the generated portion of CHANGELOG.md — the
# `[Unreleased]` section and freshly-cut release sections. The curated prose for
# 0.1.0–0.4.0 and the Keep a Changelog preamble live in CHANGELOG.md and are
# preserved by the `just changelog` / `just release` recipes (sentinel region).
# git-cliff therefore emits NO header/footer (it would duplicate the preamble).
#
# See RELEASING.md for the workflow. Output follows https://keepachangelog.com.

[changelog]
# No preamble — it lives in CHANGELOG.md.
header = ""

# Keep a Changelog body. `version` is set only when --tag is passed (release cut);
# otherwise we render the `## [Unreleased]` heading. Sections are grouped by the
# commit-parser `group`, whose `<!-- N -->` ordering marker is stripped for display.
#
# Commits carrying a `BREAKING CHANGE:` footer (or a `!` after the type) are also
# listed first, under their own heading. Without this the v0.7 changelog would
# have described a wire-format rewrite that changes signatures in five languages
# without ever using the word "breaking".
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### ⚠ Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.breaking_description | replace(from="\n", to=" ") | trim | upper_first }}
{%- endfor %}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}
{%- endfor %}
{% endfor %}
"""

# No footer — compare-URL link references are curated manually in CHANGELOG.md.
footer = ""
trim = true

[git]
conventional_commits = true
# Drop anything that isn't a conventional commit (merge commits, etc.).
filter_unconventional = true
# Only keep commits whose type maps to a section below.
filter_commits = true
split_commits = false
protect_breaking_commits = false
# Tags look like v0.4.0.
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

# Map conventional commit types to Keep a Changelog sections. The `<!-- N -->`
# prefix only controls ordering (Added → Changed → Fixed → Documentation); it is
# stripped from the rendered heading by `striptags` in the body template.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^docs?", group = "<!-- 3 -->Documentation" },
  # Noise that never belongs in the changelog.
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  # Safety net: drop anything else (e.g. non-conventional subjects).
  { message = ".*", skip = true },
]

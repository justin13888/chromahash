name: Release (PyPI)

# Publish the chromahash Python package to PyPI when a release tag is pushed.
# Releases are cut with `just release X.Y.Z` (see RELEASING.md). Publishes via
# PyPI trusted publishing (OIDC) — no stored token. Idempotent: a version already
# on PyPI is skipped.
#
# The package is a UniFFI ctypes binding, so each wheel bundles one platform's
# native cdylib. ctypes is Python-version-agnostic, so one py3-none-<platform>
# wheel per platform suffices (no per-CPython matrix). Linux wheels are built with
# cargo-zigbuild pinned to glibc 2.17 (manylinux2014). No sdist is published: the
# package has no build hook to compile the Rust, so a source install can't work.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + check wheels without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheels:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  lib: libchromahash_uniffi.so,    plat: manylinux2014_x86_64,  zig: true }
          - { runner: ubuntu-latest,  target: aarch64-unknown-linux-gnu, lib: libchromahash_uniffi.so,    plat: manylinux2014_aarch64, zig: true }
          - { runner: macos-14,       target: x86_64-apple-darwin,       lib: libchromahash_uniffi.dylib, plat: macosx_11_0_x86_64,    zig: false }
          - { runner: macos-14,       target: aarch64-apple-darwin,      lib: libchromahash_uniffi.dylib, plat: macosx_11_0_arm64,     zig: false }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc,    lib: chromahash_uniffi.dll,      plat: win_amd64,             zig: false }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig (Linux cross)
        if: matrix.zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: command -v cargo-zigbuild >/dev/null 2>&1 || cargo install cargo-zigbuild --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      # Build the cdylib for this platform, generate the (platform-independent)
      # ctypes bindings, and stage both into the package — mirrors `just python-cbuild`
      # but with an explicit --target so the output path is uniform across runners.
      - name: Build cdylib + stage into package
        shell: bash
        run: |
          set -euo pipefail
          # Platform cdylib (the wheel payload). Linux uses cargo-zigbuild pinned to
          # glibc 2.17 for manylinux2014 compatibility.
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --manifest-path bindings/uniffi/Cargo.toml --target ${{ matrix.target }}.2.17
          else
            cargo build --release --manifest-path bindings/uniffi/Cargo.toml --target ${{ matrix.target }}
          fi
          cp "bindings/uniffi/target/${{ matrix.target }}/release/${{ matrix.lib }}" python/chromahash/
          # Platform-independent ctypes bindings: generate from a HOST-NATIVE build
          # (mirrors `just python-cbuild`). uniffi-bindgen reads the namespace from the
          # library's embedded metadata, which cross-compiled (zigbuild / cross-arch)
          # libs can omit — so bindgen must run against a native build, never the
          # cross-compiled payload above. The .py is identical across platforms.
          cargo build --release --manifest-path bindings/uniffi/Cargo.toml
          gen="$(mktemp -d)"
          ( cd bindings/uniffi && cargo run --release --quiet --bin uniffi-bindgen -- \
              generate --library "target/release/${{ matrix.lib }}" \
              --language python --out-dir "$gen" )
          cp "$gen/chromahash_uniffi.py" python/chromahash/_uniffi.py

      - name: Build + re-tag wheel
        working-directory: python
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          # hatchling emits py3-none-any; re-tag to this platform (the wheel carries
          # a platform-specific native lib, so it is not pure-Python).
          uvx wheel tags --platform-tag ${{ matrix.plat }} --remove dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.plat }}
          path: python/dist/*.whl
          if-no-files-found: error

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-wheel-*
          merge-multiple: true
          path: dist

      - name: Verify tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -oE '^version = "[^"]+"' python/pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')"
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag does not match python/pyproject.toml version $ver" >&2
            exit 1
          fi

      - name: Assert wheels are platform-specific
        run: |
          set -euo pipefail
          ls -1 dist/*.whl
          if ls dist/*-any.whl >/dev/null 2>&1; then
            echo "Found a pure (-any) wheel — platform re-tag failed" >&2; exit 1
          fi
          count="$(ls -1 dist/*.whl | wc -l)"
          test "$count" -eq 5 || { echo "Expected 5 wheels, got $count" >&2; exit 1; }

      - name: Skip if version already on PyPI
        id: check
        run: |
          ver="$(grep -oE '^version = "[^"]+"' python/pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')"
          if curl -sSfI "https://pypi.org/pypi/chromahash/$ver/json" >/dev/null 2>&1; then
            echo "Version $ver already on PyPI — skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check wheels (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: pipx run twine check dist/*.whl

      - name: Publish to PyPI
        if: steps.check.outputs.published == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

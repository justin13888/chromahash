name: CI (Go)

on:
  push:
    branches: [master]
    paths: ["go/**", "bindings/c/**", "rust/**", "spec/test-vectors/**", ".github/workflows/ci-go.yml"]
  pull_request:
    paths: ["go/**", "bindings/c/**", "rust/**", "spec/test-vectors/**", ".github/workflows/ci-go.yml"]

jobs:
  ci:
    # The Go package is a cgo wrapper over chromahash-c, so it needs a C toolchain
    # and the prebuilt static library staged into go/lib.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build + stage the chromahash-c static library
        run: |
          cargo build --manifest-path bindings/c/Cargo.toml --release
          mkdir -p go/lib go/include
          cp bindings/c/target/release/libchromahash_c.a go/lib/
          cp bindings/c/include/chromahash.h go/include/

      - name: Format check
        working-directory: go
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: go
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Test
        working-directory: go
        env:
          CGO_ENABLED: "1"
        run: go test ./...

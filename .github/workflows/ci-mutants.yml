name: CI (Mutants)

# Mutation testing of the core Rust crate (cargo-mutants). On a pull request we
# only mutate the lines the PR changed (`--in-diff` vs the merge base) and fail
# if any mutant survives the test suite — i.e. new/changed core code must be
# exercised, not just compiled. The full sweep is slow (~2000 mutants), so it
# runs on a weekly schedule (and on demand) rather than on every push: a gap the
# incremental gate cannot see is one in code nobody is touching, which is worth
# catching eventually but not worth blocking every PR on.
on:
  pull_request:
    paths: ["rust/**", ".github/workflows/ci-mutants.yml"]
  schedule:
    # Mondays 04:00 UTC, off the usual working hours of the runners.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  # PR gate: mutate only the changed core lines and require the suite kills them.
  incremental:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the base branch present to diff against

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # Cargo.lock is gitignored repo-wide, so key off the manifest.
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('rust/Cargo.toml') }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Diff core changes vs merge base
        run: git -C rust diff --relative "origin/${{ github.base_ref }}" -- . > "$RUNNER_TEMP/rust.diff"

      # `cargo mutants --in-diff` with an empty diff errors out rather than
      # succeeding, so a PR whose `rust/**` match came from the workflow file
      # alone would fail for no reason. `justfile`'s mutants-rust-diff has the
      # same guard.
      - name: Mutation-test changed lines
        run: |
          if [ ! -s "$RUNNER_TEMP/rust.diff" ]; then
            echo "no core Rust changes vs origin/${{ github.base_ref }} — nothing to mutate"
            exit 0
          fi
          cargo mutants -d rust --in-diff "$RUNNER_TEMP/rust.diff" --no-shuffle -j 2 -vV

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-incremental
          path: rust/mutants.out
          if-no-files-found: ignore

  # Weekly (and on-demand) full sweep of the whole core crate.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('rust/Cargo.toml') }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Mutation-test the whole core crate
        run: cargo mutants -d rust --no-shuffle -j 2 -vV

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-full
          path: rust/mutants.out
          if-no-files-found: ignore

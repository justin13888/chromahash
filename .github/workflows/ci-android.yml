name: CI (Android)

on:
  push:
    branches: [master]
    paths: ["bindings/uniffi/**", ".github/workflows/ci-android.yml"]
  pull_request:
    paths: ["bindings/uniffi/**", ".github/workflows/ci-android.yml"]

jobs:
  # Enforced correctness gate — runs the spec vectors through the binding.
  # No Android NDK/SDK required; this mirrors `just {format-check,lint,test}-android`.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/uniffi
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bindings/uniffi/target
          # Cargo.lock is gitignored repo-wide, so key off the manifest.
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('bindings/uniffi/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

  # Cross-compile every ABI, generate the Kotlin bindings, and assemble the AAR.
  # ubuntu-latest ships the Android SDK + an NDK (ANDROID_NDK_LATEST_HOME).
  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Cargo + cargo-ndk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            bindings/uniffi/target
          key: ${{ runner.os }}-cargo-androidaar-${{ hashFiles('bindings/uniffi/Cargo.toml') }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('bindings/uniffi/android/**/*.gradle*', 'bindings/uniffi/android/**/gradle-wrapper.properties') }}

      # `assembleRelease`'s preBuild depends on the cargo-ndk + uniffi-bindgen tasks,
      # so this single step exercises the exact build path that ships.
      - name: Assemble AAR
        working-directory: bindings/uniffi/android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "Using NDK at: $ANDROID_NDK_HOME"
          ./gradlew assembleRelease --stacktrace

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: chromahash-android-aar
          path: bindings/uniffi/android/build/outputs/aar/*.aar
          if-no-files-found: error

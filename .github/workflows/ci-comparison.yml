name: CI (Comparison Tool)

on:
  push:
    branches: [master]
    paths:
      - "tools/comparison/**"
      - "typescript/**"
      # The R-D gate exists to catch encoder quality regressions, and the
      # encoder is in rust/. Without this the gate never fired on the changes
      # it was built for.
      - "rust/**"
      - ".github/workflows/ci-comparison.yml"
  pull_request:
    paths:
      - "tools/comparison/**"
      - "typescript/**"
      # The R-D gate exists to catch encoder quality regressions, and the
      # encoder is in rust/. Without this the gate never fired on the changes
      # it was built for.
      - "rust/**"
      - ".github/workflows/ci-comparison.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            typescript/pnpm-lock.yaml
            tools/comparison/pnpm-lock.yaml

      # The TS package wraps the wasm-pack glue (full encode+decode), so the WASM
      # build must be staged into typescript/wasm/ before tsc can consume it.
      - name: Install Rust toolchain + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --locked

      - name: Cache Cargo (wasm)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bindings/wasm/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('bindings/wasm/Cargo.toml') }}

      - name: Build WASM glue (staged into typescript/wasm/)
        run: wasm-pack build --target web bindings/wasm --out-dir ../../typescript/wasm

      # Build the TypeScript library dependency first
      - name: Install TypeScript lib dependencies
        run: pnpm --prefix typescript install --frozen-lockfile

      - name: Build TypeScript lib
        run: pnpm --prefix typescript run build

      # Build the comparison tool
      - name: Install comparison tool dependencies
        run: pnpm --prefix tools/comparison install --frozen-lockfile

      - name: Format check
        run: pnpm --prefix tools/comparison run format:check

      - name: Lint
        run: pnpm --prefix tools/comparison run lint

      - name: Build
        run: pnpm --prefix tools/comparison run build

      # Build CLI harnesses (verify they compile) — the Rust toolchain is already
      # installed above for the WASM glue build.

      # Cache the installed iqa-cli binary so the vendored C++ (ssimulacra2 /
      # butteraugli / libjxl) isn't rebuilt on every run. Keyed by version.
      - name: Cache iqa-cli
        id: cache-iqa
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/iqa-cli
          key: iqa-cli-1.2.1-${{ runner.os }}

      - name: Install iqa-cli
        if: steps.cache-iqa.outputs.cache-hit != 'true'
        run: cargo install iqa-cli --locked --version 1.2.1

      - name: Build Rust harness
        run: cargo build --manifest-path rust/Cargo.toml --example encode_stdin

      # The comparison report below proves the harness still runs; it does not
      # prove the format still performs. This gate (spec/EXPERIMENTS.md U18)
      # encodes a handful of content-pinned corpus photos at tier 0 and fails if
      # mean ΔE00 has drifted from tools/comparison/baselines/rd-gate.json, so a
      # silent rate-distortion regression cannot land unnoticed. It needs a
      # release build — the debug encoder is the same bytes but far slower.
      - name: Build Rust harness (release, for the R-D gate)
        run: cargo build --manifest-path rust/Cargo.toml --release --example encode_stdin

      - name: R-D regression gate (tier 0)
        run: node tools/comparison/dist/rd-gate.js

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.mod

      # The Go harness is a cgo wrapper over chromahash-c, so stage the static
      # lib + header into go/lib + go/include before building (see ci-go.yml).
      - name: Build + stage the chromahash-c static library
        run: |
          cargo build --manifest-path bindings/c/Cargo.toml --release
          mkdir -p go/lib go/include
          cp bindings/c/target/release/libchromahash_c.a go/lib/
          cp bindings/c/include/chromahash.h go/include/

      - name: Build Go harness
        env:
          CGO_ENABLED: "1"
        run: cd go && go build ./cmd/encode-stdin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Python harness syntax
        run: python -m py_compile python/chromahash/encode_stdin.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"

      - name: Build C# solution (includes CLI)
        run: dotnet build csharp/Chromahash.sln --verbosity quiet

      # Build the report straight into index.html so it is deploy-ready for
      # Cloudflare Pages (which serves a directory and resolves index.html at /).
      - name: Run comparison (skip cross-language harnesses)
        run: pnpm --prefix tools/comparison run compare --skip-harnesses --output output/index.html

      # Hand the report off to the Deploy Comparison Report workflow, which runs
      # in a separate context and cannot see this job's working tree. Only master
      # pushes are deployed, so don't store the artifact for PR runs. Upload the
      # whole output directory so index.html, index.json, and the standalone
      # images/ assets it references all travel together.
      - name: Upload comparison report
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report
          path: tools/comparison/output
          if-no-files-found: error
          retention-days: 7

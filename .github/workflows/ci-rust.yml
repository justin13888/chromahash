name: CI (Rust)

on:
  push:
    branches: [master]
    paths: ["rust/**", "spec/test-vectors/**", ".github/workflows/ci-rust.yml"]
  pull_request:
    paths: ["rust/**", "spec/test-vectors/**", ".github/workflows/ci-rust.yml"]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          # Cargo.lock is gitignored repo-wide, so hashFiles() on it returns the
          # empty string and the key never changes — key off the manifest, as the
          # other workflows do.
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.toml') }}

      - name: Format check
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --features full -- -D warnings

      # `--features full` adds `simd-diff-tests`, so the AVX2 + SSE2 backends are
      # differentially validated here on the x86_64 runner (GitHub's runners have
      # AVX2). The remaining backends are covered by the `simd-diff` matrix below.
      - name: Test
        run: cargo test --features full

      # The crate advertises a pure-scalar, no-default-features build (the scalar
      # WASM artifact and any consumer that does not want `core::arch`). Nothing
      # else in CI compiles that configuration, so a `simd`-only item could land
      # and break it silently.
      - name: Build without default features
        run: cargo build --no-default-features

      - name: Test without default features
        run: cargo test --no-default-features

  # The crate declares `rust-version = "1.85"`. Nothing verified it: an API
  # stabilized after that would compile fine on `stable` and break every consumer
  # pinned to the advertised minimum. (That is not hypothetical — `is_multiple_of`
  # in an example was stable-from-1.87 and went unnoticed until the lint recipes
  # started checking test and example targets.)
  msrv:
    name: MSRV (declared minimum)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version from the manifest
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"

      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # `rust/rust-toolchain.toml` pins `channel = "stable"`, and a toolchain
      # file beats the rustup default that the action sets — so a plain `cargo
      # build` in this directory silently runs on stable and the job proves
      # nothing. `cargo +<version>` overrides the file explicitly.
      #
      # Examples and tests are included: an MSRV violation in an example is
      # exactly what went unnoticed before (`is_multiple_of`, stable from 1.87),
      # and both dev-dependencies do compile on 1.85.
      - name: Build on the declared MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          # Fail loudly if the pin ever stops taking effect.
          cargo "+$MSRV" --version
          cargo "+$MSRV" build --all-targets
          cargo "+$MSRV" build --no-default-features
          cargo "+$MSRV" test --no-run

  # Each SIMD backend only compiles for its own target, so "test every backend"
  # means running the differential suite on (or under emulation of) every target.
  # With `simd-diff-tests` these tests fail rather than skip on a host that can't
  # execute the backend, so a mis-targeted job can't pass green with zero coverage.
  simd-diff:
    name: SIMD diff · ${{ matrix.label }}
    needs: ci
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 NEON on a native Arm runner — also re-runs the full spec
          # vectors, confirming byte-identical output on Arm.
          - label: aarch64 neon
            kind: native
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # x86_64 forced to an SSE2-but-no-AVX2 CPU via QEMU, exercising the SSE2
          # backend and the no-AVX2 dispatch fallback the native runner never hits.
          - label: x86_64 sse2-only (qemu)
            kind: sse2-qemu
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # wasm32 simd128 under wasmtime.
          - label: wasm32 simd128 (wasmtime)
            kind: wasm
            runs-on: ubuntu-latest
            target: wasm32-wasip1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install QEMU (user-mode)
        if: matrix.kind == 'sse2-qemu'
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Install wasmtime
        if: matrix.kind == 'wasm'
        uses: taiki-e/install-action@v2
        with:
          tool: wasmtime

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.kind }}-${{ matrix.target }}-cargo-${{ hashFiles('rust/Cargo.toml') }}

      - name: Differential tests
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.kind }}" in
            native)
              cargo test --target ${{ matrix.target }} --features full
              ;;
            sse2-qemu)
              # `-cpu Nehalem` has SSE2 but not AVX2: the SSE2 backend and the
              # SSE2 dispatch path run, while the AVX2 test would (correctly) fail
              # on this CPU — so skip just that one.
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="qemu-x86_64 -cpu Nehalem"
              cargo test --target ${{ matrix.target }} --features full simd:: -- --skip avx2
              ;;
            wasm)
              # Scope to the `simd::` differential tests: wasm32-wasip1 has no
              # thread support, so the full lib suite would abort in the
              # thread-spawning `batch` tests. (Matches `mise run test:simd:emulated`.)
              export RUSTFLAGS="-C target-feature=+simd128"
              export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime"
              cargo test --lib --target ${{ matrix.target }} --features full simd::
              ;;
          esac

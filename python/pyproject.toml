[project]
name = "chromahash"
version = "0.5.0"
description = "ChromaHash: modern LQIP (Low Quality Image Placeholder) format"
authors = [{ name = "Justin Chung", email = "noreply@justinchung.net" }]
license = "MIT OR Apache-2.0"
keywords = ["image", "placeholder", "lqip", "thumbnail", "preview"]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/justin13888/chromahash"
Repository = "https://github.com/justin13888/chromahash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Generated UniFFI bindings — not hand-maintained, regenerated by `just python-cbuild`.
extend-exclude = ["chromahash/_uniffi.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

commit-msg:
  commands:
    convco:
      # {1} is the path to the commit message file; convco lints it via stdin.
      run: mise exec -- convco check --from-stdin < {1}

pre-commit:
  piped: true
  commands:
    format-fix:
      priority: 1
      run: just format-fix
    lint-fix:
      priority: 2
      run: just lint-fix
    check-clean:
      priority: 3
      run: git diff --exit-code

pre-push:
  commands:
    commit-lint:
      # Lint the conventional-commit format of the commits being pushed (those
      # ahead of origin/master), complementing the per-commit `commit-msg` hook
      # and mirroring the master check in the `ci-commits` workflow. Skips
      # gracefully if origin/master isn't present locally.
      run: |
        base="$(git rev-parse --verify --quiet origin/master)" || base=""
        if [ -n "$base" ]; then mise exec -- convco check "$base..HEAD"; fi
    format-check:
      run: just format-check
    lint-check:
      run: just lint
    test:
      run: just test
    mutants-rust:
      # Mutation-test only the core lines this push changes (cargo-mutants
      # --in-diff vs origin/master). Gated on core .rs edits so non-Rust pushes
      # skip it. Skip explicitly with: LEFTHOOK_EXCLUDE=mutants-rust git push
      glob: "rust/src/**/*.rs"
      run: just mutants-rust-diff

commit-msg:
  commands:
    convco:
      # {1} is the path to the commit message file; convco lints it via stdin.
      run: mise exec -- convco check --from-stdin < {1}

pre-commit:
  piped: true
  commands:
    format-fix:
      priority: 1
      run: just format-fix
    lint-fix:
      priority: 2
      run: just lint-fix
    check-clean:
      priority: 3
      run: git diff --exit-code

pre-push:
  commands:
    format-check:
      run: just format-check
    lint-check:
      run: just lint
    test:
      run: just test

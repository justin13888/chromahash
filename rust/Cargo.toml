[package]
name = "chromahash"
version = "0.6.0"
authors = ["Justin Chung <noreply@justinchung.net>"]
edition = "2024"
rust-version = "1.85"
description = "Modern, high-quality image placeholder representation for professional formats"
license = "MIT OR Apache-2.0"
repository = "https://github.com/visualcommons/chromahash"
homepage = "https://github.com/visualcommons/chromahash"
documentation = "https://docs.rs/chromahash"
readme = "README.md"
keywords = ["image", "placeholder", "lqip", "thumbnail", "preview"]
categories = ["multimedia::images", "encoding", "compression"]

[dependencies]

[features]
# `spec-vectors` (on by default) enables the integration golden test
# `tests/spec_vectors.rs`, which reads ../spec/test-vectors. It's a no-op for
# library consumers — it only gates a dev test target. cargo-mutants builds with
# --no-default-features so it skips that target: the sweep stages only the rust/
# crate, without the sibling spec/ dir, so the test couldn't compile there. The
# encode/decode pipeline is pinned for the sweep by the self-contained golden
# unit tests in src/encode.rs and src/decode.rs instead. See rust/mutants.toml.
default = ["spec-vectors", "simd"]
spec-vectors = []

# `simd` (on by default) enables the hand-written `core::arch` SIMD backends for
# the hot per-pixel color math (AVX2/SSE2 on x86, NEON on aarch64, simd128 on
# wasm), selected at runtime (x86) or compile time (others). It adds no
# dependencies and no public API: output is byte-identical to the scalar path,
# which is always retained as the fallback. Build `--no-default-features` (or
# without `simd`) for a pure-scalar build — e.g. the scalar WASM artifact or a
# conservative target. See `src/simd/`.
simd = []

# `simd-diff-tests` (off by default) compiles the per-backend SIMD differential
# tests in `src/simd/` — each pins one *specific* vector backend (AVX2, SSE2,
# NEON, wasm simd128) against the scalar reference. It is a dev/CI-only switch
# with no library API and implies `simd`. Two properties make it worth a flag of
# its own: it is platform-specific (each backend only compiles for its target,
# so coverage means running — or emulating — every target), and unlike a plain
# `cargo test` it *fails* rather than skips on a host that cannot execute a
# backend it was asked to validate, so a mis-targeted run can never pass with
# zero coverage. CI runs it per machine target; locally use `just test-simd-diff`
# (native) or `just test-simd-emulated` (every target via QEMU/wasmtime).
simd-diff-tests = ["simd"]

# `full` turns on every feature — the default set plus the opt-in
# `simd-diff-tests` — for "test everything" invocations (CI and `just`).
full = ["spec-vectors", "simd", "simd-diff-tests"]

[[test]]
name = "spec_vectors"
required-features = ["spec-vectors"]

[dev-dependencies]
# Test-only: parse the shared spec test vectors and assert the reference
# implementation reproduces them byte-for-byte. The published crate stays
# dependency-free — serde_json never enters the runtime graph. Mirrors the
# golden-vector tests in the binding crates (bindings/c, bindings/uniffi, ...).
serde_json = "1"

# cargo-mutants configuration for the chromahash core crate.
# Run the sweep with `just mutants-rust` (full) or `just mutants-rust-diff`
# (changed lines only); see TESTING.md § Mutation Testing.

# Drop the default `spec-vectors` feature so the `spec_vectors` integration test
# (gated by required-features in Cargo.toml) is skipped: it reads the sibling
# ../spec/test-vectors dir, which cargo-mutants' isolated per-crate build does
# not stage, so it can't compile here. The encode/decode pipeline is pinned for
# the sweep by the self-contained golden unit tests in src/encode.rs and
# src/decode.rs instead.
no_default_features = true

# Exclusions — each line is a mutant that cannot be killed by any test because
# the mutation is *equivalent* (produces identical observable behaviour) or only
# affects resource cleanup. Keep this list short and justified; prefer adding a
# test over an exclusion.
exclude_re = [
    # `if scale < 1e-10` floors near-constant channels to exact zero. No input
    # lands a channel's peak |AC| exactly on 1e-10 (solids ~1e-15, detail ≫1e-10),
    # so `<` and `<=` are indistinguishable.
    "src/dct.rs.*replace < with <= in dct_encode_selected",
    # `if ratio > 1.0` picks the landscape branch. decode_aspect(byte) is 2^k for
    # k = byte/255*8 - 4, which equals 1.0 only at the non-integer byte 127.5, so
    # ratio is never exactly 1.0 and `>` vs `>=` are equivalent over all 256 bytes.
    "src/aspect.rs.*replace > with >= in decode_output_size",
    # Drop joins the worker threads; replacing it with a no-op leaks threads but
    # leaves every batch result byte-identical, so no functional test can observe it.
    "src/batch.rs.*replace <impl Drop for BatchEncoder>::drop with \\(\\)",

    # Header (de)packing ORs each field into a disjoint bit/byte range, so `|` and
    # `^` produce identical results — the values are clamped to fit their fields,
    # so no two ever share a set bit. The golden hashes pin the packed result.
    "replace \\| with \\^ in encode_with",
    "replace \\| with \\^ in read_aspect",
    "replace \\| with \\^ in render_at_size",
    "replace \\| with \\^ in average_color_with",

    # The decode-aware DC search scans the symmetric offset set {0, -1, 1} and
    # keeps the first strict improvement. Negating an offset (`l0 + dl` → `l0 - dl`)
    # scans the same set, and `<` vs `<=` only reorders exact-tie candidates — both
    # yield identical codes. Dropping the `-1` offset would only change a result if
    # some channel's optimum sat exactly one step below nominal, which no input in
    # the spec corpus reaches.
    "replace \\+ with - in select_dc_codes",
    "delete - in select_dc_codes",
    "replace < with <= in select_dc_codes",

    # Numeric kernels. portable_ln / portable_exp range-reduce in a loop: operator
    # mutations either re-converge to the same value (the series is invariant to
    # which 2^k bracket is chosen) or never terminate (timeouts). The remaining
    # comparisons guard the x==0 / boundary cases the early returns already handle.
    # All are pinned by the exact known-value tests in this module; mutation adds
    # no signal. (cbrt_signed is also retained only for those tests.)
    "in portable_ln",
    "in portable_exp",
    "replace < with <= in portable_cos",
    "replace > with >= in portable_cos",
    "replace < with <= in cbrt_halley",
    "replace > with >= in cbrt_signed",
    # mu_compress feeds portable_ln; these two mutations pass it a non-finite
    # argument (outside its x>0 domain), hanging in ln's reduction loop rather than
    # failing — a property of the kernel, not a test gap.
    "replace \\+ with - in mu_compress",
    "replace \\* with / in mu_compress",
]

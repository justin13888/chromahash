# cbindgen config for the ChromaHash C API.
# The header is regenerated into include/chromahash.h by build.rs on every build;
# the committed copy is the artifact C consumers use, and CI diffs it to catch drift.

language = "C"
header = """
/*
 * ChromaHash — C API.
 *
 * GENERATED by cbindgen from `bindings/c` — do not edit by hand. Regenerate with
 * `just gen-c-header` (or any `cargo build` of the chromahash-c crate).
 *
 * Conventions:
 *   - Fallible functions return a ChromaHashStatus code (CHROMA_HASH_STATUS_OK == 0);
 *     results are written through out-parameters.
 *   - ChromaHash / ChromaHashBatchEncoder are opaque handles — create with a
 *     constructor, release with the matching *_free.
 *   - A decoded ChromaHashImage is owned by the library: release it with
 *     chromahash_image_free. Input RGBA buffers are read-only and caller-owned.
 */"""
pragma_once = true
include_guard = "CHROMAHASH_H"
cpp_compat = true
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "type"
usize_is_size_t = true

[parse]
# The public surface is entirely in this crate; never descend into the core.
parse_deps = false

[export]
# Emit the opaque handle typedefs even though they only appear behind pointers.
include = ["ChromaHash", "ChromaHashBatchEncoder"]

[enum]
# Srgb -> CHROMA_HASH_GAMUT_SRGB, Ok -> CHROMA_HASH_STATUS_OK: collision-safe,
# idiomatic C constant names derived from the (already prefixed) enum type name.
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = false

[package]
name = "chromahash-c"
version = "0.6.0"
authors = ["Justin Chung <noreply@justinchung.net>"]
# Edition 2021 is deliberate, not stale. A Rust edition is a source-language
# concept (macro hygiene, prelude, the `unsafe` rules for `extern` blocks) and
# has zero effect on the emitted C ABI — consumers get the same symbols either
# way — so 2021 vs 2024 is immaterial for a crate whose entire public surface is
# `extern "C"`. It stays on 2021 only because nothing here needs 2024 features;
# the core crate is on edition 2024.
#
# The C surface is hand-written `#[no_mangle] extern "C"` fns (with cbindgen
# generating the header), not an auto-generated binding, on purpose: a
# first-class C API wants full control over the exact symbol names, the
# struct/enum ABI, and a clean idiomatic header — control a generator would not
# give. (UniFFI serves the higher-level languages; this C ABI is the low-level
# foundation that C# and Go also link against.)
edition = "2021"
description = "C ABI (cbindgen) exposing the ChromaHash core to C — and the FFI foundation the C# and Go bindings link against"
license = "MIT OR Apache-2.0"
repository = "https://github.com/justin13888/chromahash"
publish = false

[lib]
name = "chromahash_c"
# "lib" lets the integration test link the crate and call the extern fns as Rust
# fns; "staticlib" is the .a Go links via cgo; "cdylib" is the .so/.dylib/.dll
# that C consumers and the C# P/Invoke layer load.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
chromahash = { path = "../../rust" }

[build-dependencies]
# Generates include/chromahash.h from this crate's extern "C" surface on build.
# Lives only here — the core crate stays dependency-free.
cbindgen = "0.27"

[dev-dependencies]
# Test-only: parse the shared spec test vectors and drive them through the C ABI.
serde_json = "1"

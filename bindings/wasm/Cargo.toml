[package]
name = "chromahash-wasm"
# Edition 2021 (like chromahash-c): a thin wasm-bindgen wrapper needs no 2024
# features. The core crate stays on edition 2024.
edition = "2021"
version = "0.7.1"
authors = ["Justin Chung <noreply@justinchung.net>"]
description = "WebAssembly bindings (wasm-bindgen) exposing the ChromaHash core to JavaScript/TypeScript on the web"
license = "MIT OR Apache-2.0"
repository = "https://github.com/visualcommons/chromahash"
publish = false

[lib]
# "cdylib" is the .wasm wasm-pack ships; "rlib" lets the wasm-bindgen-test target
# link the crate for the parity test.
crate-type = ["cdylib", "rlib"]

[dependencies]
chromahash = { path = "../../rust" }
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Test-only: parse the shared spec vectors (embedded via include_str! at compile
# time, since the wasm test runner has no filesystem).
serde_json = "1"
